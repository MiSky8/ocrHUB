[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocrhub"
version = "0.1.0"
description = "One Docker image, many OCR engines, one API."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pytesseract>=0.3.10",
    "Pillow>=10.1",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "httpx>=0.27",
    "mcp>=2.2,<3",
]

[project.optional-dependencies]
# Pinned: surya-ocr's 0.20+ line rewrote RecognitionPredictor around a
# VLM inference backend (llama.cpp/vllm, requiring an external
# llama-server binary or a GPU) with a completely different call signature
# (no det_predictor kwarg) and no per-line confidence scores at all. 0.14.7
# is a release on the earlier torch detection+recognition architecture that
# matches this adapter's det_predictor-based API and TextLine.confidence
# usage; verified working end-to-end against a real Docker build.
# (Versions between 0.14.7 and the 0.20+ rewrite were not individually
# checked - 0.14.7 is simply the one that was verified.)
#
# numpy<2 is also pinned: it is part of the environment this adapter was
# verified in. (It was first added to avoid an opencv/NumPy clash with
# PaddleOCR, which has since been removed; the pin was kept so the verified
# environment doesn't change. Dropping it is untested.)
surya = ["surya-ocr==0.14.7", "numpy<2"]
# brotlicffi: Datalab's API responses are Brotli-encoded; the SDK's aiohttp
# client needs this to decompress them (see agentVLM/pyproject.toml, which
# vendors the same datalab_sdk usage this adapter is based on).
datalab = ["datalab-python-sdk>=0.5", "brotlicffi>=1.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "fpdf2>=2.7", "numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ocrhub = ["web/templates/*.html", "web/static/*"]
