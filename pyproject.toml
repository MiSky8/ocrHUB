[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocrhub"
version = "0.1.0"
description = "One Docker image, many OCR engines, one API."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pytesseract>=0.3.10",
    "Pillow>=10.1",
    "pdfplumber>=0.11",
    # <2: PyMuPDF 2.0 pulls in pymupdf4llm, pymupdf-layout and onnxruntime, and in the
    # Docker image (aarch64) rendering a PDF with it and then building PaddleOCR's
    # models segfaults the whole process. 1.28.2 is fine.
    "pymupdf>=1.24,<2",
    "httpx>=0.27",
    "mcp>=2.2,<3",
]

[project.optional-dependencies]
# Pinned: surya-ocr's 0.20+ line rewrote RecognitionPredictor around a
# VLM inference backend (llama.cpp/vllm, requiring an external
# llama-server binary or a GPU) with a completely different call signature
# (no det_predictor kwarg) and no per-line confidence scores at all. 0.14.7
# is a release on the earlier torch detection+recognition architecture that
# matches this adapter's det_predictor-based API and TextLine.confidence
# usage; verified working end-to-end against a real Docker build.
# (Versions between 0.14.7 and the 0.20+ rewrite were not individually
# checked - 0.14.7 is simply the one that was verified.)
#
# numpy<2 is no longer pinned: it was only kept from the old PaddleOCR 2.7.3
# opencv clash. 0.14.7 was run on NumPy 2.3.5 / Python 3.13 in a conda env
# (real photo, correct output); the Docker image check is still pending.
surya = ["surya-ocr==0.14.7"]
# Written against paddleocr 3.x (predict() API, PP-OCRv6 models), checked in a
# local conda env (paddleocr 3.7.0, paddlepaddle 3.3.1, numpy 2.3.5). The Linux
# wheels on PyPI stop at paddlepaddle 3.2.2, hence the 3.2 floor. PaddleOCR
# alone was also run in the Docker image (ENGINES=paddleocr); PaddleOCR next to
# Surya in one image was not tried. The old 2.7.3 pins forced opencv 4.6 /
# numpy<2; 3.x doesn't.
paddleocr = ["paddleocr>=3.7,<4", "paddlepaddle>=3.2,<4"]
# brotlicffi: Datalab's API responses are Brotli-encoded; the SDK's aiohttp
# client needs this to decompress them (see agentVLM/pyproject.toml, which
# vendors the same datalab_sdk usage this adapter is based on).
datalab = ["datalab-python-sdk>=0.5", "brotlicffi>=1.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "fpdf2>=2.7", "numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ocrhub = ["web/templates/*.html", "web/static/*"]
