services:
  ocrhub:
    build:
      context: .
      args:
        # Comma-separated optional engines to install at build time (surya,
        # paddleocr, datalab). tesseract/pdfplumber are always installed.
        ENGINES: ${ENGINES:-}
    ports:
      - "8000:8000"
    environment:
      # Reachable Ollama instance for the DeepSeek vision engine.
      - OLLAMA_HOST=${OLLAMA_HOST:-}
      # Datalab hosted OCR API (https://www.datalab.to) - leave blank to disable.
      - DATALAB_API_KEY=${DATALAB_API_KEY:-}
      - DATALAB_BASE_URL=${DATALAB_BASE_URL:-}
      - DATALAB_MODE=${DATALAB_MODE:-}
      - DATALAB_TIMEOUT=${DATALAB_TIMEOUT:-}
      # Surya on CPU holds a whole batch of line crops in memory; its default
      # batch got the container OOM-killed on a phone photo. Smaller = slower
      # but safe on Docker Desktop's default ~8 GB. Raise both if you have RAM.
      - RECOGNITION_BATCH_SIZE=${SURYA_RECOGNITION_BATCH_SIZE:-8}
      - DETECTOR_BATCH_SIZE=${SURYA_DETECTOR_BATCH_SIZE:-1}
      # Layout and table models run after recognition (reading order, regions,
      # tables). SURYA_LAYOUT=0 skips them and returns plain lines, which needs
      # less memory and time.
      - SURYA_LAYOUT=${SURYA_LAYOUT:-1}
      - LAYOUT_BATCH_SIZE=${SURYA_LAYOUT_BATCH_SIZE:-2}
      - TABLE_REC_BATCH_SIZE=${SURYA_TABLE_REC_BATCH_SIZE:-2}
    volumes:
      # Persists downloaded Surya/PaddleOCR model weights across restarts.
      - ocrhub-models:/home/ocrhub/.cache
      # Uploaded files and every engine's OCR output as JSON, keyed by content
      # hash, in a plain folder you can open: ./data/input and ./data/output
      # (override with OCRHUB_DATA_DIR). Also the result cache - same file +
      # engine skips recomputation; see /ocr's `refresh` field.
      - ${OCRHUB_DATA_DIR:-./data}:/home/ocrhub/data

volumes:
  ocrhub-models:
